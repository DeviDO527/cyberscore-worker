sonar.host.url=http://localhost:9000

sonar.projectName=CyberScore - Worker
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts,test/**/*.spec.ts

sonar.exclusions=node_modules/**,coverage/**,dist/**
sonar.coverage.exclusions=src/servidor.ts,src/**/*.d.ts,src/**/types.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Set SONAR_TOKEN in the shell before analysis; do not store credentials in this file.
